name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tests/companion-module.test.ts читает src модуля, а его tsconfig наследует @companion-module/tools
      - run: corepack enable && yarn install --immutable
        working-directory: companion-module
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
