<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Концепт C: «Слайд + таймер» — экран презентации с кольцом обратного отсчёта -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#171b24"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/>
      <stop offset="1" stop-color="#dde3ec"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- экран -->
  <rect x="200" y="248" width="624" height="440" rx="40" fill="url(#scr)"/>
  <rect x="268" y="330" width="270" height="44" rx="22" fill="#39415a"/>
  <rect x="268" y="420" width="480" height="28" rx="14" fill="#9aa5bd"/>
  <rect x="268" y="476" width="420" height="28" rx="14" fill="#b9c2d4"/>
  <rect x="268" y="532" width="452" height="28" rx="14" fill="#b9c2d4"/>
  <!-- кольцо-таймер поверх угла экрана -->
  <circle cx="700" cy="712" r="164" fill="#12151d"/>
  <circle cx="700" cy="712" r="164" fill="none" stroke="#2c3550" stroke-width="30"/>
  <!-- пройденная дуга (≈ 270°), зелёная -->
  <path d="M 700 548 A 164 164 0 1 1 536 712" fill="none" stroke="#3ecf6a" stroke-width="30" stroke-linecap="round"/>
  <!-- стрелка -->
  <line x1="700" y1="712" x2="700" y2="596" stroke="#f2f4f8" stroke-width="26" stroke-linecap="round"/>
  <circle cx="700" cy="712" r="22" fill="#f2f4f8"/>
</svg>
